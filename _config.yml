title: Enhancing Maritime Safety
description: Developing an accessible real-time semantic wave imaging analyser for seakeeping
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

show_downloads: false
github:
  is_project_page: false

collections:
  outputs:
    output: true
    permalink: /outputs/:name/

defaults:
  - scope:
      path: ""
      type: "outputs"
    values:
      layout: "output"

exclude:
  - _site/
  - .jekyll-cache/
  - reference_material/
  - Gemfile
  - Gemfile.lock
  - README.md
