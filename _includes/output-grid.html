<div class="output-grid">
  {% assign outputs = site.outputs | sort: "order" %}
  {% for output in outputs %}
    <a class="output-card output-link-card" href="{{ output.url | relative_url }}">
      <img class="output-card-image{% if output.image_fit == 'contain' %} output-card-image--contain{% endif %}" src="{{ output.image | relative_url }}" alt="" loading="lazy">
      <span class="output-card-copy">
        <span class="output-card-title">{{ output.output_title | default: output.title }}</span>
        {% if output.description %}
          <span class="output-summary">{{ output.description }}</span>
        {% endif %}
      </span>
    </a>
  {% endfor %}
</div>
