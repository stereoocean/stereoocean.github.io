<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="page-masthead">
      {% include nav.html %}
      <div class="page-title">
        <p class="grant-line">EPSRC project EP/X035778/1 | University of Portsmouth</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}
          <p>{{ page.description }}</p>
        {% endif %}
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
