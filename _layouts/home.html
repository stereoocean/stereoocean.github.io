<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-hero" id="top">
      <div class="hero-media" aria-hidden="true"></div>
      {% include nav.html %}

      <div class="hero-content">
        <p class="grant-line">{{ page.grant_line }}</p>
        <h1>{{ page.hero_title }}</h1>
        <p class="hero-subtitle">{{ page.hero_subtitle }}</p>
        <div class="hero-actions" aria-label="Project links">
          <a class="btn btn-primary" href="https://gtr.ukri.org/projects?ref=EP%2FX035778%2F1">
            UKRI Gateway to Research
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M14 5h5v5"></path>
              <path d="M10 14 19 5"></path>
              <path d="M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4"></path>
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main id="main">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
